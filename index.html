<!DOCTYPE html>
<html lang="en">
<head>
<title>Leon Ou</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Leon Ou">
<meta name="description" content="Leon Ou's personal homepage.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --text: #1a1a1a; --muted: #737373; --accent: #b5541c; --rule: #e6e6e6; }
* { box-sizing: border-box; }
body { margin: 0; background: #fff; color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  font-size: 17px; line-height: 1.65; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
h1 { font-family: Newsreader, Georgia, serif; font-weight: 500; font-size: 56px; line-height: 1.05; margin: 0 0 18px; letter-spacing: -0.01em; }
.wrap { max-width: 720px; margin: 0 auto; padding: 96px 28px 64px; }
.links { font-size: 16px; margin: 0 0 40px; }
.links a { color: var(--muted); border-bottom: 1px solid #d6d6d6; }
.links a:hover { text-decoration: none; color: var(--accent); border-color: var(--accent); }
.bio { font-size: 17.5px; line-height: 1.7; }
footer { margin-top: 64px; padding-top: 18px; border-top: 1px solid var(--rule); font-size: 14px; color: var(--muted); }
@media (max-width: 720px) { .wrap { padding: 56px 20px 48px; } h1 { font-size: 42px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Leon Ou</h1>
  <p class="links"><a href="https://scholar.google.com/">Google Scholar</a></p>
  <p class="bio">This is a placeholder bio for Leon Ou; a proper one is coming soon.</p>
  <footer>Last update: September 2026</footer>
</div>
</body>
</html>
